plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
	splitEnvironmentSourceSets()
	mods {
		"rapbattle" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	// Libraries bundled inside the mod jar (jar-in-jar) together with all their transitive deps.
	bundled
	implementation.extendsFrom bundled
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Keyframe animations for players (rapping, dances), shipped inside our jar.
	modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.12+mc.1.21.11"
	include "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.12+mc.1.21.11"
	// Optional: the settings button in Mod Menu.
	modCompileOnly "com.terraformersmc:modmenu:17.0.1"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

repositories {
	maven { url = "https://repo.redlance.org/public" }
	maven { url = "https://maven.terraformersmc.com/releases" }
}

afterEvaluate {
	configurations.bundled.resolvedConfiguration.resolvedArtifacts.each { a ->
		def id = a.moduleVersion.id
		dependencies.add("include", "${id.group}:${id.name}:${id.version}")
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
